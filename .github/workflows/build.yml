name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: latest

      - name: Check
        run: odin check src -vet

      - name: Build
        run: odin build src -out:pvz-speed.exe -o:speed -extra-linker-flags:"/FORCE:MULTIPLE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvz-speed
          path: pvz-speed.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pvz-speed.exe
          generate_release_notes: true
